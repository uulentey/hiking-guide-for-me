<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маршрутын дэлгэрэнгүй — Live2Hike</title>
  <link rel="stylesheet" href="style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">
        <svg viewBox="0 0 24 24"><polyline points="2,20 8,8 12,14 16,4 22,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      UB Hiking
    </a>
    <button class="nav-toggle" aria-label="Цэс" aria-expanded="false">☰</button>
    <nav class="primary-nav">
      <a href="index.html">Нүүр</a>
      <a href="explore.html">Explore</a>
      <a href="map.html" class="active">Газрын зураг</a>
      <a href="#" onclick="alert('V2-т нэмэгдэнэ');return false;">Community</a>
    </nav>
  </div>
</header>

<div class="detail-hero">
  <div class="wrap">
    <div>
      <div class="hero-eyebrow">ROUTE MAP</div>
      <h1 id="route-name">Маршрут сонгоно уу</h1>
      <p id="route-desc" style="color:#121312;max-width:56ch;"></p>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="stat-row" id="stat-row"></div>

    <div class="map-toolbar">
      <label for="map-layer-select">Free map:</label>
      <select id="map-layer-select">
        <option value="osm">OpenStreetMap</option>
        <option value="carto-light">Carto Light</option>
        <option value="carto-dark">Carto Dark</option>
        <option value="topo">OpenTopoMap</option>
      </select>
    </div>

    <div id="map" style="height: 60vh; min-height: 250px; max-height: 500px; margin: 20px 0; border-radius: var(--radius); border: 1px solid var(--line);"></div>

    <div class="safety-note" style="margin-top:28px;">
      <span>⚠</span>
      <div><b>Анхаарах зүйлс:</b> <span id="safety-text">Маршрут сонгон анхааруулга үүсгэнэ.</span></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>UB Hiking Guide — MVP</div>
    <div>route database + map + community + planning</div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script src="main.js"></script>
<script>
// Wait for ROUTES to be loaded from main.js
let map = null;
let currentRoute = null;
let baseLayers = {};

function initMap() {
  if (map) return;

  map = L.map('map').setView([47.8864, 106.9057], 12);

  baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }),
    'carto-light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }),
    'carto-dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }),
    topo: L.tileLayer('https://a.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="https://viewfinderpanoramas.org">SRTM</a> | map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
      maxZoom: 18
    })
  };

  const defaultLayer = baseLayers.osm;
  defaultLayer.addTo(map);

  const layerSelect = document.getElementById('map-layer-select');
  layerSelect.addEventListener('change', (event) => {
    const selected = event.target.value;
    Object.entries(baseLayers).forEach(([key, layer]) => {
      if (key === selected) {
        if (!map.hasLayer(layer)) layer.addTo(map);
      } else if (map.hasLayer(layer)) {
        map.removeLayer(layer);
      }
    });
  });
}

function updateRouteUI(route) {
  if (!route) {
    document.getElementById('route-name').textContent = 'Маршрут олдсонгүй';
    document.getElementById('route-desc').textContent = 'Маршрутын мэдээлэл байхгүй байна.';
    document.getElementById('stat-row').innerHTML = '';
    document.getElementById('safety-text').textContent = 'Маршрут сонгоно уу.';
    map.setView([47.8864, 106.9057], 12);
    return;
  }

  document.getElementById('route-name').textContent = route.name;
  document.getElementById('route-desc').textContent = route.desc;
  document.getElementById('stat-row').innerHTML = `
    <div><b>${route.distanceKm} км</b><span>Зай</span></div>
    <div><b>${route.elevationM} м</b><span>Өгсөлт</span></div>
    <div><b>${route.timeHr}</b><span>Цаг</span></div>
    <div><b>${route.difficulty}</b><span>Түвшин</span></div>
    <div><b>${route.season}</b><span>Улирал</span></div>
  `;

  let safetyText = '';
  switch (route.difficulty) {
    case 'Хялбар':
      safetyText = 'Зам өргөн, дундаж ши.жээлцтэй.';
      break;
    case 'Дунд':
      safetyText = 'Бороотой үед хальтрах эрсдэлтэй.';
      break;
    case 'Хэцүү':
      safetyText = 'Д архи, дээдэн цэгүүдтэй, алдаамжтой.';
      break;
    default:
      safetyText = 'Маршрутын тодорхойлолт байхгүй.';
  }
  document.getElementById('safety-text').textContent = safetyText;

  if (route.track && route.track.length >= 2) {
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
    }
    const polyline = L.polyline(route.track, { color: 'green', weight: 5 }).addTo(map);
    window.currentPolyline = polyline;
    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
  } else {
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
      window.currentPolyline = null;
    }
    map.setView([47.8864, 106.9057], 12);
    document.getElementById('map').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-family:var(--font-mono);font-size:0.85rem;">Маршрутын coordinate байхгүй</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initMap();

  const routes = Array.isArray(window.ROUTES) ? window.ROUTES : [];
  if (!routes.length) {
    document.getElementById('route-name').textContent = 'Маршрут боломжгүй';
    document.getElementById('route-desc').textContent = 'Маршрутын мэдээлэл ачаалагдаагүй байна.';
    document.getElementById('safety-text').textContent = 'Маршрут сонгоно уу.';
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const routeId = params.get('id');
  currentRoute = routeId ? routes.find(r => r.id === routeId) || routes[0] : routes[0];
  if (currentRoute) {
    updateRouteUI(currentRoute);
  }

  const selector = document.createElement('select');
  selector.id = 'route-selector';
  selector.style = 'margin: 10px auto; display: block; padding: 8px; font-size: 1rem;';
  routes.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name;
    if (currentRoute && r.id === currentRoute.id) opt.selected = true;
    selector.appendChild(opt);
  });

  const heroWrap = document.querySelector('.detail-hero .wrap');
  if (heroWrap && !document.getElementById('route-selector')) {
    heroWrap.appendChild(selector);
  }

  selector.addEventListener('change', (e) => {
    const selectedId = e.target.value;
    const route = routes.find(r => r.id === selectedId);
    if (route) {
      currentRoute = route;
      updateRouteUI(route);
      window.history.replaceState(null, '', `?id=${route.id}`);
    }
  });
});
</script>
</body>
</html>
