<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маршрутын дэлгэрэнгүй — UB Hiking</title>
  <link rel="stylesheet" href="style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">
        <svg viewBox="0 0 24 24"><polyline points="2,20 8,8 12,14 16,4 22,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      UB Hiking
    </a>
    <button class="nav-toggle" aria-label="Цэс" aria-expanded="false">☰</button>
    <nav class="primary-nav">
      <a href="index.html">Нүүр</a>
      <a href="explore.html">Explore</a>
      <a href="map.html" class="active">Газрын зураг</a>
      <a href="#" onclick="alert('V2-т нэмэгдэнэ');return false;">Төлөвлөх</a>
      <a href="#" onclick="alert('V2-т нэмэгдэнэ');return false;">Community</a>
    </nav>
  </div>
</header>

<div class="detail-hero">
  <div class="wrap">
    <div>
      <div class="hero-eyebrow>ROUTE MAP</div>
      <h1 id="route-name">Маршрут сонгоно уу</h1>
      <p id="route-desc" style="color:#121312;max-width:56ch;"></p>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="stat-row" id="stat-row"></div>

    <div id="map" style="height: 60vh; min-height: 250px; max-height: 500px; margin: 20px 0; border-radius: var(--radius); border: 1px solid var(--line);"></div>

    <button class="btn btn-primary save-btn" id="save-btn">Хадгалах</button>

    <div class="safety-note" style="margin-top:28px;">
      <span>⚠</span>
      <div><b>Анхаарах зүйлс:</b> <span id="safety-text">Маршрут сонгон анхааруулга үүсгэнэ.</span></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>UB Hiking Guide — MVP</div>
    <div>route database + map + community + planning</div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script src="main.js"></script>
<script>
// Wait for ROUTES to be loaded from main.js
let map = null;
let currentRoute = null;

// Initialize map with a default view (Ulaanbaatar)
function initMap() {
  if (map) return; // already initialized
  map = L.map('map').setView([47.8864, 106.9057], 12); // Ulaanbaatar coords

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
}

// Update UI when route changes
function updateRouteUI(route) {
  document.getElementById('route-name').textContent = route.name;
  document.getElementById('route-desc').textContent = route.desc;
  document.getElementById('stat-row').innerHTML = `
    <div><b>${route.distanceKm} км</b><span>Зай</span></div>
    <div><b>${route.elevationM} м</b><span>Өгсөлт</span></div>
    <div><b>${route.timeHr}</b><span>Цаг</span></div>
    <div><b>${route.difficulty}</b><span>Түвшин</span></div>
    <div><b>${route.season}</b><span>Улирал</span></div>
  `;

  // Safety text based on difficulty
  let safetyText = '';
  switch (route.difficulty) {
    case 'Хялбар':
      safetyText = 'Зам өргөн, дундаж ши.жээлцтэй.';
      break;
    case 'Дунд':
      safetyText = 'Бороотой үед хальтрах эрсдэлтэй.';
      break;
    case 'Хэцүү':
      safetyText = 'Д архи, дээдэн цэгүүдтэй, алдаамжтой.';
      break;
    default:
      safetyText = 'Маршрутын тодорхойлолт байхгүй.';
  }
  document.getElementById('safety-text').textContent = safetyText;

  // Update map
  if (route.track && route.track.length >= 2) {
    // Remove existing polyline if any
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
    }
    const polyline = L.polyline(route.track, {color: 'green', weight: 5}).addTo(map);
    window.currentPolyline = polyline;
    // Zoom to fit the polyline
    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
  } else {
    // Clear map and show placeholder
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
      window.currentPolyline = null;
    }
    map.setView([47.8864, 106.9057], 12);
    document.getElementById('map').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-family:var(--font-mono);font-size:0.85rem;">Маршрутын coordinate байхгүй</div>';
    // If we set innerHTML, we lose the Leaflet map; better to just not add polyline and keep map.
    // So we'll just ensure map exists and show a message via an overlay.
    // For simplicity, we'll just not add polyline and maybe show a tooltip.
  }
}

// Initial load: show first route or from URL param
document.addEventListener('DOMContentLoaded', () => {
  initMap();

  const params = new URLSearchParams(window.location.search);
  const routeId = params.get('id');
  if (routeId && window.ROUTES) {
    currentRoute = window.ROUTES.find(r => r.id === routeId);
  } else {
    currentRoute = window.ROUTES[0];
  }
  if (currentRoute) {
    updateRouteUI(currentRoute);
  }

  // Optional: add a route selector UI (simple dropdown)
  const selector = document.createElement('select');
  selector.id = 'route-selector';
  selector.style = 'margin: 10px auto; display: block; padding: 8px; font-size: 1rem;';
  window.ROUTES.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name;
    if (r.id === currentRoute.id) opt.selected = true;
    selector.appendChild(opt);
  });
  // Insert selector after hero
  document.querySelector('.detail-hero .wrap').appendChild(selector);

  selector.addEventListener('change', (e) => {
    const selectedId = e.target.value;
    const route = window.ROUTES.find(r => r.id === selectedId);
    if (route) {
      currentRoute = route;
      updateRouteUI(route);
      // Update URL without reloading
      window.history.replaceState(null, '', `?id=${route.id}`);
    }
  });
});

// Save button (demo)
document.getElementById('save-btn').addEventListener('click', () => {
  alert('Хадгалагдлаа (демо — Firebase холбогдоогүй тул reload хийвэл алга болно).');
});
</script>
</body>
</html>
