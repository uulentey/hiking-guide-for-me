<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Газрын зураг — walky</title>
  <link rel="stylesheet" href="style.css?v=admin-1">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
</head>
<body data-page="map">
<a class="skip-link" href="#main-content">Үндсэн хэсэг рүү очих</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">
        <svg viewBox="0 0 24 24"><polyline points="2,20 8,8 12,14 16,4 22,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      walky
    </a>
    <nav class="primary-nav" aria-label="Үндсэн цэс">
      <a href="index.html">Нүүр</a>
      <a href="explore.html">Жимүүд</a>
      <a href="map.html" class="active">Газрын зураг</a>
      <a href="my-hikes.html">Миний алхалтууд</a>
    </nav>
  </div>
</header>

<main id="main-content" class="wrap map-workspace">
  <aside class="map-sidebar map-hero">
    <div class="map-intro"><p class="eyebrow">ЖИМЭЭ ЗУРАГ ДЭЭР ХАРААРАЙ</p><h1>Газрын зураг</h1></div>
    <div class="map-route-picker"><label for="route-selector">Алхах жимээ сонгоорой</label><select id="route-selector"></select></div>
    <img id="map-preview" class="map-preview" src="zurag/emoSandal.jpg" alt="Сонгосон жимийн зураг">
    <div class="detail-copy"><h2 id="route-name">Жимээ сонгоорой</h2><p id="route-desc" class="map-route-description"></p></div>
    <div class="stat-row" id="stat-row"></div>
    <a id="map-detail-link" class="btn btn-dark" href="explore.html">Жимийн тухай үзэх →</a>
    <div class="safety-note"><span aria-hidden="true">⚠</span><div><b>Явахаасаа өмнө:</b> <span id="safety-text">Жимээ сонгоод мэдээллийг нь хараарай.</span></div></div>
  </aside>
  <section class="map-stage" aria-label="Жимийн газрын зураг">
    <div class="map-toolbar"><label for="map-layer-select">Харагдац</label><select id="map-layer-select"><option value="osm">Энгийн</option><option value="carto-light">Цайвар</option><option value="carto-dark">Бараан</option><option value="topo">Уул, газрын өндөр</option></select></div>
    <div id="map"></div>
    <p id="map-empty" class="map-empty" role="status" hidden>Энэ жимийг газрын зураг дээр харуулж чадсангүй.</p>
  </section>
</main>

<footer>
  <div class="wrap">
    <div>walky</div>
    <div class="footer-links"><span>Өөрийн хэмнэлээр алхаарай.</span><a href="admin.html">Удирдлага</a></div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="content-model.js"></script>
<script src="firebase-service.js"></script>
<script src="hikes-store.js"></script>
<script src="main.js?v=admin-1"></script>
<script>
// Wait for ROUTES to be loaded from main.js
let map = null;
let currentRoute = null;
let baseLayers = {};

function initMap() {
  if (map || !window.L) return;

  map = L.map('map', { zoomControl: false }).setView([47.8864, 106.9057], 12);
  L.control.zoom({ zoomInTitle: 'Ойртуулах', zoomOutTitle: 'Холдуулах' }).addTo(map);

  baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }),
    'carto-light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }),
    'carto-dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20
    }),
    topo: L.tileLayer('https://a.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="https://viewfinderpanoramas.org">SRTM</a> | map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',
      maxZoom: 18
    })
  };

  const defaultLayer = baseLayers.osm;
  defaultLayer.addTo(map);

  const layerSelect = document.getElementById('map-layer-select');
  layerSelect.addEventListener('change', (event) => {
    const selected = event.target.value;
    Object.entries(baseLayers).forEach(([key, layer]) => {
      if (key === selected) {
        if (!map.hasLayer(layer)) layer.addTo(map);
      } else if (map.hasLayer(layer)) {
        map.removeLayer(layer);
      }
    });
  });
}

function updateRouteUI(route) {
  if (map && window.currentPolyline) {
    map.removeLayer(window.currentPolyline);
    window.currentPolyline = null;
  }
  const image = /^(https:\/\/|zurag\/)[^\s]+$/i.test(route?.image || '') ? route.image : 'zurag/bogdGorhi.jpg';
  document.getElementById('map-preview').src = image;
  document.getElementById('map-preview').alt = route ? `${route.name} — жимийн зураг` : '';
  document.getElementById('map-detail-link').href = route ? `route-detail.html?id=${encodeURIComponent(route.id)}` : 'explore.html';
  document.getElementById('map-empty').hidden = Boolean(map && route?.track?.length >= 2);

  if (!route) {
    document.getElementById('route-name').textContent = 'Энэ жим олдсонгүй';
    document.getElementById('route-desc').textContent = 'Өөр жим сонгоод дахин үзээрэй.';
    document.getElementById('stat-row').innerHTML = '';
    document.getElementById('safety-text').textContent = 'Жимээ сонгоод мэдээллийг нь хараарай.';
    map?.setView([47.8864, 106.9057], 12);
    return;
  }

  document.getElementById('route-name').textContent = route.name;
  document.getElementById('route-desc').textContent = route.desc;
  document.getElementById('stat-row').innerHTML = `
    <div><b>${escapeHTML(route.distanceKm)} км</b><span>Алхах зай</span></div>
    <div><b>${escapeHTML(route.elevationM)} м</b><span>Өгсөлт</span></div>
    <div><b>${escapeHTML(route.timeHr)}</b><span>Хугацаа (цаг)</span></div>
    <div><b>${escapeHTML(route.difficulty)}</b><span>Түвшин</span></div>
    <div><b>${escapeHTML(route.season)}</b><span>Алхах улирал</span></div>
  `;

  let safetyText = '';
  switch (route.difficulty) {
    case 'Хялбар':
      safetyText = 'Явах өдрийнхөө цаг агаар, замын нөхцөлийг шалгаарай.';
      break;
    case 'Хөнгөн - Дунд':
    case 'Дунд':
      safetyText = 'Бороотой үед зам халтирч болзошгүй. Яаралгүй, болгоомжтой алхаарай.';
      break;
    case 'Хэцүү':
      safetyText = 'Өөрийн бэлтгэлдээ тохируулж, явах замаа урьдчилан төлөвлөөрэй.';
      break;
    default:
      safetyText = 'Явах өдрийнхөө цаг агаар, замын нөхцөлийг шалгаарай.';
  }
  document.getElementById('safety-text').textContent = safetyText;

  if (!map) return;
  if (route.track && route.track.length >= 2) {
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
    }
    const polyline = L.polyline(route.track, { color: '#235843', weight: 4 }).addTo(map);
    window.currentPolyline = polyline;
    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
  } else {
    if (window.currentPolyline) {
      map.removeLayer(window.currentPolyline);
      window.currentPolyline = null;
    }
    map.setView([47.8864, 106.9057], 12);
    document.getElementById('map-empty').hidden = false;
  }
}

function renderMapRoutes() {
  const routes = Array.isArray(window.ROUTES) ? window.ROUTES : [];
  const selector = document.getElementById('route-selector');
  selector.replaceChildren();
  selector.disabled = !routes.length;
  if (!routes.length) {
    currentRoute = null;
    updateRouteUI(null);
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const routeId = params.get('id');
  currentRoute = routeId ? routes.find(r => r.id === routeId) || routes[0] : routes[0];
  if (currentRoute) {
    updateRouteUI(currentRoute);
  }

  routes.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name;
    if (currentRoute && r.id === currentRoute.id) opt.selected = true;
    selector.appendChild(opt);
  });
}

window.addEventListener('routes:updated', renderMapRoutes);
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  renderMapRoutes();

  document.getElementById('route-selector').addEventListener('change', (e) => {
    const selectedId = e.target.value;
    const route = window.ROUTES.find(r => r.id === selectedId);
    if (route) {
      currentRoute = route;
      updateRouteUI(route);
      window.history.replaceState(null, '', `?id=${encodeURIComponent(route.id)}`);
    }
  });
});
</script>
</body>
</html>
