<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live2Hike</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark">
        <svg viewBox="0 0 24 24"><polyline points="2,20 8,8 12,14 16,4 22,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </span>
      Live2Hike
    </a>
    <button class="nav-toggle" aria-label="Цэс" aria-expanded="false">☰</button>
    <nav class="primary-nav">
      <a href="index.html">Нүүр</a>
      <a href="explore.html" class="active">Explore</a>
      <a href="map.html">Газрын зураг</a>
      <a href="#" onclick="alert('V2-т нэмэгдэнэ');return false;">Community</a>
    </nav>
  </div>
</header>

<section style="padding-bottom:0;">
  <div class="wrap">
    <div class="section-head">
      <h2>Маршрут хайх</h2>
    </div>

    <div class="explore-hero">
      <div class="explore-hero-copy">
        <span class="eyebrow">Explore</span>
        <h3>Хаашаа алхахаа сонгоорой</h3>
        <p>Хотоос ойр Богд уул, Тэрэлж, гэр бүлээрээ явах боломжтой замуудын дундаас хамгийн тохирох маршрутаа олоорой.</p>
      </div>
      <div class="explore-hero-metrics">
        <div><strong>5+</strong><span>сонирхолтой маршрут</span></div>
        <div><strong>3</strong><span>түвшин</span></div>
        <div><strong>1</strong><span>сэтгэл ханамж</span></div>
      </div>
    </div>

    <div class="filter-bar">
      <input type="search" id="search-input" placeholder="Маршрутын нэрээр хайх...">
      <select id="difficulty-filter">
        <option value="">Бүх түвшин</option>
        <option value="Хялбар">Хялбар</option>
        <option value="Дунд">Дунд</option>
        <option value="Хэцүү">Хэцүү</option>
      </select>
    </div>

    <div class="route-grid" id="route-grid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div>Live2Hike</div>
    <div>route + map + community</div>
  </div>
</footer>

<script src="main.js"></script>
<script>initExplore();</script>
</body>
</html>
